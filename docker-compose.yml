version: '3.8'

services:
  postgres:
    image: postgres:17-alpine
    container_name: vertex-postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-micro_oauth}
    ports:
      - "${DB_PORT_HOST:-5434}:5432"
    volumes:
      - vertex_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d micro_oauth"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - vertex-network

  redis:
    image: redis/redis-stack-server:latest
    container_name: vertex-redis
    restart: always
    ports:
      - "${REDIS_PORT_HOST:-6379}:6379"
    volumes:
      - vertex_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - vertex-network

  eureka-server:
    build:
      context: ./eureka-server
      dockerfile: Dockerfile
    container_name: vertex-eureka
    restart: always
    ports:
      - "7801:7801"
    environment:
      - SERVER_PORT=7801
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_CLOUD_COMPATIBILITY_VERIFIER_ENABLED=false
    networks:
      - vertex-network

  config-server:
    build:
      context: ./config-server
      dockerfile: Dockerfile
    container_name: vertex-config
    restart: always
    ports:
      - "8888:8888"
    environment:
      - SERVER_PORT=8888
      - EUREKA_SERVER_URL=http://eureka-server:7801/eureka/
      - SPRING_CLOUD_COMPATIBILITY_VERIFIER_ENABLED=false
    depends_on:
      - eureka-server
    networks:
      - vertex-network

  oauth-server:
    build:
      context: ./oauth-server
      dockerfile: Dockerfile
    container_name: vertex-oauth
    restart: always
    ports:
      - "7901:7901"
    environment:
      - SERVER_PORT=7901
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=micro_oauth
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - EUREKA_SERVER_URL=http://eureka-server:7801/eureka/
      - CONFIG_SERVER_URL=http://config-server:8888/
      - SPRING_CLOUD_COMPATIBILITY_VERIFIER_ENABLED=false
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      eureka-server:
        condition: service_started
    networks:
      - vertex-network

  stellar-oauth:
    build:
      context: ./stellar-oauth
      dockerfile: Dockerfile
    container_name: vertex-ui
    restart: always
    ports:
      - "7802:7802"
    environment:
      - SERVER_PORT=7802
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - EUREKA_SERVER_URL=http://eureka-server:7801/eureka/
      - CONFIG_SERVER_URL=http://config-server:8888/
      - SPRING_CLOUD_COMPATIBILITY_VERIFIER_ENABLED=false
    depends_on:
      - redis
      - eureka-server
      - oauth-server
    networks:
      - vertex-network

  gateway-server:
    build:
      context: ./gateway-server
      dockerfile: Dockerfile
    container_name: vertex-gateway
    restart: always
    ports:
      - "${GATEWAY_PORT:-8085}:8080"
    environment:
      - SERVER_PORT=8080
      - EUREKA_SERVER_URL=http://eureka-server:7801/eureka/
      - CONFIG_SERVER_URL=http://config-server:8888/
      - SPRING_CLOUD_COMPATIBILITY_VERIFIER_ENABLED=false
    depends_on:
      - eureka-server
      - oauth-server
      - stellar-oauth
    networks:
      - vertex-network

networks:
  vertex-network:
    driver: bridge

volumes:
  vertex_pgdata:
  vertex_redisdata:

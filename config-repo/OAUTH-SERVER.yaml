spring:
  cloud:
    compatibility-verifier:
      enabled: false
  h2:
    console:
      enabled: true
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
  sql:
    init:
      continue-on-error: true
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:micro_oauth}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    show-sql: false
  cache:
    type: redis
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

server:
  port: ${SERVER_PORT:7901}
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:7801/eureka/}

management:
  endpoints:
    web:
      exposure:
        include: health,refresh

security:
  password:
    secret-key: 1mnv84&0J7*cry5Yv1@@1F@7Ygx$kXW2~3
    encode-key: 4n*&9L^rXdIZ4dcz6S!0*qMdZ8Y2CWJ8!9
  algorithm:
    encode-alg: HmacSHA256
  token:
    expiration-time: 14400000 #4H
    expiration-request-time: 5000 #5S
  default:
    username: admin
    password: admin
    role-name: ROLE_ADMIN

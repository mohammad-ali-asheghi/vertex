spring:
  ai:
    openai:
      api-key: ${OPEN_API_KEY}
      base-url: https://api.gapgpt.app
  h2:
    console:
      enabled: true
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
  sql:
    init:
      continue-on-error: true
  datasource:
    url: jdbc:postgresql://0.0.0.0:5432/micro_ai
    username: postgres
    password: postgres
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    show-sql: true
  cache:
    type: redis
  data:
    redis:
      host: localhost
      port: 6379

server:
  port: 7804
eureka:
  client:
    service-url:
      defaultZone: http://localhost:7801/eureka

management:
  endpoints:
    web:
      exposure:
        include: health,refresh
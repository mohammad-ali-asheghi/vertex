spring:
  application:
    name: CONFIG-SERVER
  profiles:
    active:
      - native
  cloud:
    compatibility-verifier:
      enabled: false
    config:
      name: vertex
      server:
        native:
          search-locations:
            - classpath:/config/
            - file:./config-repo/
            - file:/app/config/

server:
  port: 8888
eureka:
  client:
    service-url:
      defaultZone: http://localhost:7801/eureka

management:
  endpoints:
    web:
      exposure:
        include: health, refresh
spring:
  application:
    name: GATEWAY-SERVER
  cloud:
    compatibility-verifier:
      enabled: false
    gateway:
      routes:
        - id: oauth-server
          uri: lb://OAUTH-SERVER
          predicates:
            - Path=/oauth/**
          filters:
            - RewritePath=/oauth/(?<path>.*), /${path}
        - id: oauth-ui-service
          uri: lb://OAUTH-UI-SERVICE
          predicates:
            - Path=/**
  config:
    import:
      - optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888/}

server:
  port: 8080

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:7801/eureka/}
